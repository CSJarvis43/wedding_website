name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Job names (gitleaks, backend, frontend) are required status checks on main.
# backend/frontend always run and report success, skipping their steps until
# the corresponding directory exists.

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f backend/pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No backend/pyproject.toml yet; skipping backend checks."
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: uv sync --locked
      - if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: uv run ruff check .
      - if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: uv run ruff format --check .
      - if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No frontend/package.json yet; skipping frontend checks."
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: pnpm lint
      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: pnpm format:check
      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: pnpm typecheck
      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: pnpm test
